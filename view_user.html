<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/user_style.css">
</head>
<body>

  <header>
    <div class="brand">
      <span>📋</span>
      <h1>TaskFlow</h1>
    </div>
    <div class="header-actions">
      <span class="usuario-nome" id="usuarioNome">Olá, ...</span>
      <button id="btnDark">🌙</button>
      <button id="btnLogout">Sair</button>
    </div>
  </header>

  <main>

    <section class="task-container">
      <input
        type="text"
        id="taskInput"
        placeholder="Nova tarefa..."
      >
      <button id="btnAdd">+ Adicionar</button>
    </section>

    <section class="task-list" id="taskList">
      <!-- tarefas injetadas pelo JS -->
    </section>

  </main>

  <footer>
    Desenvolvido com HTML5, CSS3 e JavaScript
  </footer>

  <script type="module" src="/js/scripts.js"></script>
</body>
</html>
