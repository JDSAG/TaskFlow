<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/login.css">
</head>
<body>

  <div class="bg-grid"></div>

  <div class="card">

    <div class="brand">
      <span class="brand-icon">📋</span>
      <h1>TaskFlow</h1>
      <p>Organize. Execute. Conclua.</p>
    </div>

    <!-- ABAS -->
    <div class="tabs">
      <button class="tab active" id="tabLogin" onclick="trocarAba('login')">Entrar</button>
      <button class="tab" id="tabRegistro" onclick="trocarAba('registro')">Cadastrar</button>
      <div class="tab-indicator" id="tabIndicator"></div>
    </div>

    <!-- FORM LOGIN -->
    <div class="form-section" id="formLogin">
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="seu@email.com">
      </div>
      <div class="input-group">
        <label>Senha</label>
        <input type="password" id="loginSenha" placeholder="••••••••">
      </div>
      <div class="mensagem" id="msgLogin"></div>
      <button class="btn-primary" id="btnLogin">Entrar</button>
    </div>

    <!-- FORM REGISTRO -->
    <div class="form-section hidden" id="formRegistro">
      <div class="input-group">
        <label>Nome</label>
        <input type="text" id="regNome" placeholder="Seu nome">
      </div>
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="seu@email.com">
      </div>
      <div class="input-group">
        <label>Senha</label>
        <input type="password" id="regSenha" placeholder="Mínimo 6 caracteres">
      </div>
      <div class="mensagem" id="msgRegistro"></div>
      <button class="btn-primary" id="btnRegistro">Criar conta</button>
    </div>

  </div>

  <script type="module" src="/js/login.js"></script>
</body>
</html>
