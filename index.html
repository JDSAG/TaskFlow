<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TaskFlow</title>

  <!-- LINK DO CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>📋 TaskFlow</h1>

    <button id="btnDark">
      🌙
    </button>
  </header>

  <main>

    <section class="task-container">

      <input 
        type="text" 
        id="taskInput"
        placeholder="Digite uma tarefa..."
      >

      <button id="btnAdd">
        Adicionar
      </button>

    </section>

    <section class="task-list" id="taskList">

    </section>

  </main>

  <footer>
    Desenvolvido com HTML5, CSS3 e JavaScript
  </footer>

  <!-- LINK DO JS -->
  <!-- Apenas o seu script, carregado como um módulo, que fará as importações -->
  <script type="module" src="scripts.js"></script> 

</body>
</html>
